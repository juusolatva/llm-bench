# SonarQube Cloud CI analysis (.github/workflows/sonarqube.yml). Automatic analysis is disabled in SonarQube Cloud.
sonar.projectKey=juusolatva_llm-bench
sonar.organization=juusolatva
# The script and the CI workflows. tasks/ is left out: prompts and harnesses are benchmark data that must stay
# verbatim (any change alters what models see), and some suggested "fixes" would break them (e.g. std::print is
# C++23; the tasks compile as C++17).
sonar.sources=llm_bench.py,.github
sonar.tests=tests
sonar.python.version=3.13, 3.14
