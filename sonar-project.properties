# SonarQube Cloud CI analysis (.github/workflows/sonarqube.yml). Automatic analysis is disabled in SonarQube Cloud.
sonar.projectKey=juusolatva_llm-bench
sonar.organization=juusolatva
sonar.sources=.
sonar.tests=tests
# Task prompts and harnesses are benchmark data that must stay verbatim (any change alters what models see),
# and some suggested "fixes" would break them (e.g. std::print is C++23; the tasks compile as C++17).
# tests/ is listed in sonar.tests, so it is excluded from sources to avoid indexing it twice.
sonar.exclusions=tasks/**,tests/**
sonar.python.version=3.13, 3.14
