[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmark LLMs served over an OpenAI-compatible API on sandboxed coding tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Task prompts and harnesses are long string literals that are sent to the model verbatim.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sandbox: needs a working bwrap + systemd user sandbox (skipped otherwise)"]
