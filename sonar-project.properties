# SonarQube Cloud CI analysis (the sonarqube job in .github/workflows/ci.yml). Automatic analysis is disabled in SonarQube Cloud.
sonar.projectKey=juusolatva_llm-bench
sonar.organization=juusolatva
# Everything tracked (gitignored files are skipped), so new files are picked up without editing this list.
sonar.sources=.
sonar.tests=tests
# tests/ is analyzed as test code (sonar.tests) and must not be indexed twice. tasks/ is left out: prompts and
# harnesses are benchmark data that must stay verbatim (any change alters what models see), and some suggested
# "fixes" would break them (e.g. std::print is C++23; the tasks compile as C++17).
sonar.exclusions=tasks/**,tests/**
sonar.python.version=3.13, 3.14
# Written by the workflow before the scan (coverage run -m pytest; coverage xml).
sonar.python.coverage.reportPaths=coverage.xml
