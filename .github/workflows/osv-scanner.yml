name: OSV-Scanner

# No merge_group trigger: the reusable PR workflow takes its baseline from GITHUB_BASE_REF, which is unset for merge
# groups, so it would compare the merge-group commit with itself. Add a merge-group-aware baseline before using a
# merge queue.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 15 * * 6'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One group per event type, so a push, scheduled or manual scan of main never cancels or replaces another kind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-scheduled:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --no-resolve
        -r
        ./

  scan-pr:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Fork PRs get a read-only token, so only same-repository PRs upload SARIF.
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      scan-args: |-
        --no-resolve
        -r
        ./

  # osv-scanner-reusable-pr.yml writes the base scan to an untracked old-results.json and then runs
  # `git checkout -f` on the PR, so a PR that commits its own old-results.json replaces the baseline and hides
  # the vulnerabilities it adds. This job fails on such files. It doesn't use `needs:` on scan-pr (a skipped
  # required check counts as passing); make both checks required instead.
  guard-osv-results:
    name: Guard OSV result files
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Refuse committed OSV result files
        run: |
          hits=$(git ls-files | grep -E '(^|/)[^/]*(old-results|new-results)\.json$|\.sarif$' || true)
          if [ -n "$hits" ]; then
            while IFS= read -r f; do
              echo "::error file=${f}::Reserved for OSV-Scanner results in CI; do not commit it."
            done <<< "$hits"
            exit 1
          fi
