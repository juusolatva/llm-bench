name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked --no-build --group dev ruff check .
      # Sandbox (end-to-end) tests skip themselves when bwrap + a systemd user session are unavailable.
      - run: uv run --locked --no-build --group dev pytest -rs

  sonarqube:
    name: SonarQube Cloud
    needs: test
    # GitHub withholds secrets from fork PRs, so the scan can't authenticate there. Dependabot PRs come from this
    # repository and use the Dependabot copy of SONAR_TOKEN.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # full history for blame and new-code detection
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.14"
      # Coverage for the quality gate. Sandbox tests skip themselves on CI, as in ci.yml.
      - run: uv run --locked --no-build --group dev coverage run -m pytest -q
      - run: uv run --locked --no-build --group dev coverage xml
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          # A repository + Dependabot secret; Dependabot runs cannot read environment secrets.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # zizmor: ignore[secrets-outside-env]
